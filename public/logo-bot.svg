<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MaréBots">
  <defs>
    <linearGradient id="body" x1="12" y1="14" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF449"/>
      <stop offset="0.55" stop-color="#FED24F"/>
      <stop offset="1" stop-color="#B2D959"/>
    </linearGradient>
  </defs>
  <!-- soft plate -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#7EC151"/>
  <!-- bot head -->
  <rect x="14" y="18" width="36" height="32" rx="12" fill="url(#body)"/>
  <!-- antenna -->
  <line x1="32" y1="18" x2="32" y2="10" stroke="#1F2A14" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="8" r="3.5" fill="#FFF449" stroke="#1F2A14" stroke-width="1.5"/>
  <!-- eyes -->
  <circle cx="24.5" cy="32" r="3.2" fill="#1F2A14"/>
  <circle cx="39.5" cy="32" r="3.2" fill="#1F2A14"/>
  <circle cx="25.4" cy="31.2" r="1" fill="#FFF449"/>
  <circle cx="40.4" cy="31.2" r="1" fill="#FFF449"/>
  <!-- smile -->
  <path d="M25 40.5c2.2 2.8 11.8 2.8 14 0" fill="none" stroke="#1F2A14" stroke-width="2.4" stroke-linecap="round"/>
  <!-- cheek dots -->
  <circle cx="20.5" cy="36.5" r="1.6" fill="#7EC151" opacity="0.85"/>
  <circle cx="43.5" cy="36.5" r="1.6" fill="#7EC151" opacity="0.85"/>
</svg>
